name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    paths:
      - grammar.js
      - src/**
      - bindings/**
      - queries/**
      - test/**

jobs:
  # Cheap guard: a half-applied version bump must never reach a tag.
  versions:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: script/bump-version --check   # core-only perl, no setup needed

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: tree-sitter/setup-action/cli@v2
        with:
          # Pinned deliberately. The action's default is `latest`, so CI would
          # silently follow every CLI release -- and v0.27.0 changed error
          # recovery, turning a green corpus red with no change on our side.
          # Keep this in step with the tree-sitter-cli devDependency in
          # package.json, and bump both together on purpose.
          tree-sitter-ref: v0.26.9
      - run: tree-sitter generate
      - run: tree-sitter test
      - name: C unit tests (regex heuristic)
        if: runner.os != 'Windows'
        run: |
          cc -std=c11 -Wall -Werror -I src test/c/test_intuit_more.c -o tsp_ctest
          ./tsp_ctest
